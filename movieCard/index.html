<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="one">

            <div class="title">
                <h1>Lilo and Stitch</h1>
                <h3>Family</h3>
            </div>

            <div class="rating">
                <span>7.4/10</span>
            </div>

        </div>

        <div class="two">
            <div class="poster"></div>
            <div class="information"></div>
        </div>

        <div class="three">
            <div class="price">
                <span>$19.99</span>
                <button>Buy Tickets</button>
            </div>
            <div class="trailerButton">
                <button>Play Trailer</button>
            </div>
        </div>
    </div>
</body>

</html>
